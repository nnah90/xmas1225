<html>
    <head>
        <title>1005-CSS容器設定</title>


        <style>
        /* 容器 BOX
            box-sizing: 預設是 content-box , 也可以改成border-box

            由內而外事 content內容(寬高)/padding填充/border框線/margin邊界
            除了內容,分別可以設定 上top 又right 下bottom 左left 
            框線再分 粗細(width) 樣式(style) 顏色(color)
            框線常見樣式 solid實線 dashed虛線 dotted點點 double雙線 
            transparent 透明
            border-radius: 圓角矩形的半徑
            */

            #d1{
               width: 100px;
               height: 100px;
               background-color: aqua;
               border: 7px solid black;
               /* border-color: red yellow green blue;
               border-width: 5px;
               border-style: solid/dashed/dotted/double; */
               padding: 10px; 
               box-sizing: border-box; 
               margin-bottom: 10px;
            }
            #d2{
                border: 1px solid black;
                height: 150px;
                width: 300px;
                margin: 20px;
                border-radius: 75px;/*絕對單位*/
            }
            #d3{
                border: 1px solid black;
                height: 150px;
                width: 300px;
                margin: 50px;
                border-radius: 75%;/*相對單位*/
            }
             #d4{
                border: 50px solid black;
                height: 50px;
                width: 50px;
                margin: 50px;
                border-color: red yellow green blue;
            }
            #d5 {
                width: 50px;
                height: 0px;
                border: 30px solid transparent;
                border-bottom-color: lightblue;
                border-top-width: 0;
            }
            #d6 {
                width: 0px;
                height: 0px;
                border: 55px solid transparent;
                border-top-color: lightblue;
                border-bottom-width: 0;
            }
            #d7 {
                width: 0px;
                height: 0px;
                border: 40px solid transparent;
                border-bottom-color: green;
                border-top-width: 0;
                margin-left:20px;
            }
            #d8 {
                width: 20px;
                height: 0px;
                border: 40px solid transparent;
                border-bottom-color: green;
                border-top-width: 0;
                margin-left:10px;
            }
            #d9 {
                width: 40px;
                height: 0px;
                border: 40px solid transparent;
                border-bottom-color: green;
                border-top-width: 0;
            }
            #d10 {
                width: 40px;
                height: 50px;
                background-color: brown;
                margin-left:40px;
            }
           
            #d11 {
                border: 1px solid black;
                height: 15px;
                width: 30px;
                margin: 30px;
                margin-bottom: 0;
                border-radius: 10%; 
            } 
            #d12 {
                width: 21px;
                height: 0px;
                border: 25px solid transparent;
                border-bottom-color: lightblue;
                border-top-width: 0;
                margin-left:10px;
            }
            #d13 {
                width: 70px;
                height: 100px;
                background-color: lightblue;
                margin-left:10px;
            }       
             </style>
   
    </head>

    <body>
        <div id="d1"></div>
        <div id="d2"></div>
        <div id="d3"></div>
        <div id="d4"></div>
        <hr>
        <div id="d5"></div>
        <div id="d6"></div>
        <hr>
        <div id="d7"></div>
        <div id="d8"></div>
        <div id="d9"></div>
        <div id="d10"></div>
        <hr>
        <div id="d11"></div>
        <div id="d12"></div>
        <div id="d13"></div>  
    </body>


</html>
