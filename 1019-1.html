<!DOCTYPE html>
<html>
    <head>
        <title>1019-位置與圖層</title>
        <style>
            /* position:relative是相對於自己原本的座標
               position:absolute是相對於有設定position的父容器或body的絕對座標
               可設定top/left或bottom/right

               z-index為圖層,數字大在上面,數字一樣後生成的元素在上
            */
            #dad {
                border: 3px solid black;
                width: 300px;
                height: 300px;
                position: relative;/*相對於自己原來的位置*/
                top: 20px;
                left: 20px;
            }
            #d1 {
                border: 3px solid red;
                width: 100px;
                height: 100px;
                background-color: hsla(0deg,100%,50%,1);
                position: relative;/*單純為了圖層效果,設定哪個都行*/
                z-index: 100;
            }
            #d2 {
                border: 3px solid blue;
                width: 100px;
                height: 100px;
                position: relative;
                top: 10px;
                left: 10px;
            }
            #d3 {
                border: 3px solid green;
                width: 100px;
                height: 100px;
                background-color: hsla(120deg,100%,50%,0.7);
                z-index: 90;
                position: absolute;/*相對於dad的絕對位置*/
                top: 20px;
                left: 20px;
            }
            #d4 {
                background-color: hsla(60deg,100%,50%,1);
                width: 100px;
                height: 100px;
                position: absolute;
                right: 0px;
                bottom: 0px;
            }
            #uncle {
                border: 3px dashed blue;
                width: 100px;
                height: 100px;
                position: absolute;/*相對於body的絕對位置*/
                top: 10px;
                left: 10px;
            }
        </style>

    </head>
    <body>
        <div id="dad">
            <div id="d1"></div>
            <div id="d2"></div>
            <div id="d3"></div>
            <div id="d4"></div>
        </div>
         <div id="uncle"></div>

    </body>
</html>
